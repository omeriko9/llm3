name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # macOS: the launcher contract tests run the zsh and bash 3.2 scripts in
    # bin/, and better-sqlite3 needs a C++ toolchain, which the runner has.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
